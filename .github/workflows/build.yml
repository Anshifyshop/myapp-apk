name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Signing key
        env:
          KEYPEM: ${{ secrets.ANSHIFY_KEY }}
        run: |
          if [ -n "$KEYPEM" ]; then
            printf '%s\n' "$KEYPEM" > key.pem
            if [ ! -f anshify.crt ]; then
              openssl req -new -x509 -key key.pem -sha256 -days 18250 -subj "/CN=ANSHIFY/O=ANSHIFY" -out anshify.crt
              git config user.name anshify; git config user.email anshify@users.noreply.github.com
              git add anshify.crt && git commit -qm "Add signing certificate" && git push -q origin HEAD:${GITHUB_REF_NAME} || true
            fi
            openssl pkcs12 -export -inkey key.pem -in anshify.crt -name anshify -out app/anshify.p12 -passout pass:anshify123
            keytool -list -keystore app/anshify.p12 -storepass anshify123 >/dev/null 2>&1 || { echo "Key unusable, using temporary key"; rm -f app/anshify.p12; }
            rm -f key.pem
          fi
      - run: |
          if [ -d upload ] && [ -f upload/zip.txt ]; then
            mkdir -p app/src/main/assets site; cat upload/p* > site.zip
            [ "$(stat -c %s site.zip)" = "$(cat upload/size.txt)" ] || { echo SIZE MISMATCH; exit 1; }
            unzip -q site.zip -d site
            I=$(find site -name index.html | awk '{print gsub("/","/"), $0}' | sort -n | head -1 | cut -d' ' -f2)
            [ -n "$I" ] || { echo "NO index.html IN ZIP"; exit 1; }
            cp -r "$(dirname "$I")"/. app/src/main/assets/; rm -rf upload site site.zip
          fi
          if [ -d upload ]; then mkdir -p app/src/main/assets; cat upload/p* | gunzip > app/src/main/assets/index.html; [ "$(stat -c %s app/src/main/assets/index.html)" = "$(cat upload/size.txt)" ] || { echo SIZE MISMATCH; exit 1; }; rm -rf upload; fi
      - run: gradle assembleRelease --parallel --build-cache
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk app.apk
          gh release create "b$RUN" app.apk --title "APK $RUN" --notes "Auto-built APK"
